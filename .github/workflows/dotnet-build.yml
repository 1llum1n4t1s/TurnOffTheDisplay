permissions:
  contents: read

# 同じ ref の古い検証 run は新しい push で取り消す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: .NET ビルド

# release/** の push は release.yml が同じ検証をこのワークフローの workflow_call で先に走らせるため、
# ここでは release/** を除いて二重実行を避ける。
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches-ignore:
      - 'release/**'
  pull_request:

jobs:
  build:
    name: .NET ビルド
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      # テストプロジェクトは存在しない。実在する検証は R2 転送ヘルパーの fixture 検査 (Run.ps1) とビルド (警告はエラー)。
      - name: R2 転送ヘルパーの検証
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: 依存関係を復元
        run: dotnet restore TurnOffTheDisplay.slnx

      - name: ビルド
        run: dotnet build TurnOffTheDisplay.slnx --configuration Release --no-restore

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-release
          path: |
            bin/Release/**/*.exe
            bin/Release/**/*.dll
            !bin/Release/**/ref/**
          retention-days: 3
