permissions:
  contents: read

# 同じ ref の古い検証 run は新しい push で取り消す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

name: .NET ビルド

# 版タグの push は release.yml が同じ検証をこのワークフローの workflow_call で先に走らせる。
# ここでの push はブランチだけ (タグでは起動しない) なので二重実行にならない。
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: .NET ビルド
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      # テストプロジェクトは存在しない。実在する検証は R2 転送ヘルパーの fixture 検査 (Run.ps1) とビルド (警告はエラー)。
      - name: R2 転送ヘルパーの検証
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: NuGet パッケージキャッシュを復元
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-dotnet-build-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-dotnet-build-${{ github.job }}-
            ${{ runner.os }}-nuget-

      - name: 依存関係を復元
        run: dotnet restore TurnOffTheDisplay.slnx

      - name: NuGet パッケージキャッシュを保存
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: ビルド
        run: dotnet build TurnOffTheDisplay.slnx --configuration Release --no-restore

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-release
          path: |
            bin/Release/**/*.exe
            bin/Release/**/*.dll
            !bin/Release/**/ref/**
          retention-days: 3
